<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/general-imports :: head-common(#{owners.title})}" />
</head>
<body>
<header>
    <div th:replace="~{components/navigation :: navigation}"></div>
</header>
<main>
    <h1 th:text="#{owners.heading}">Registered owners</h1>
    <p th:if="${#lists.isEmpty(owners)}" th:text="#{owners.empty}">No owners found</p>
    <table th:unless="${#lists.isEmpty(owners)}">
        <thead>
        <tr>
            <th th:text="#{owners.tablename}">Name</th>
            <th th:text="#{owners.tablefamilyname}">Family Name</th>
            <th th:text="#{owners.tablecats}">Page</th>
        </tr>
        </thead>
        <tbody th:each="owner : ${owners}">
        <tr>
            <td th:text="${owner.name}">Name</td>
            <td th:text="${owner.familyName}">Family name</td>
            <td>
                <a th:action="g" th:href="@{/owners/{ownerId}(ownerId=${owner.ownerId})}" th:text="#{owners.enter}">View</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/owners/new}" th:text="#{owners.register}">Register new owner!</a>
</main>
</body>
</html>
