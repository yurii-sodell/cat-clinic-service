<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registered owners</title>
    <link rel="stylesheet" th:href="@{css/style.css}">
</head>
<body>
<header>
    <div th:replace="~{components/navigation :: navigation}"></div>
</header>

    <h1>Registered owners</h1>
    <p th:if="${#lists.isEmpty(owners)}"></p>
    <table th:unless="${#lists.isEmpty(owners)}">
        <thead>
        <tr>
            <th>Name</th>
            <th>Family Name</th>
            <th>Cats</th>
        </tr>
        </thead>
        <tbody th:each="owner : ${owners}">
            <tr>
                <td th:text="${owner.name}">Name</td>
                <td th:text="${owner.familyName}">Family name</td>
                <td>
                    <ul th:each="cat : ${owner.cats}">
                        <li th:text="${cat.name}">Cat name</li>
                    </ul>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/owners/new}">Register new owner!</a>
</body>
</html>
