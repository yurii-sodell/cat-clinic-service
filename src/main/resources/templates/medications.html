<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/general-imports :: head-common(#{medications.title})}" />
</head>
<body>
<header>
    <div th:replace="~{components/navigation :: navigation}"></div>
</header>
<main>
    <h1 th:text="#{medications.heading}">Medications catalog</h1>

    <p th:if="${#lists.isEmpty(medications)}" th:text="#{medications.empty}">No medications found</p>

    <table th:unless="${#lists.isEmpty(medications)}">
        <thead>
        <tr>
            <th th:text="#{medications.tabletitle}">Title</th>
            <th th:text="#{medications.tableprice}">Price</th>
            <th th:text="#{medications.tabletype}">Type</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="medication: ${medications}">
            <td th:text="${medication.title}">Medication</td>
            <td th:text="${medication.price}">0</td>
            <td th:text="${medication.medicationType}">type</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/medications/new}" th:text="#{medications.addnew}">Add new medication!</a>
</main>
</body>
</html>
