<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medication catalog</title>
    <link rel="stylesheet" th:href="@{css/style.css}">
</head>
<body>
<header>
    <div th:replace="~{components/navigation :: navigation}"></div>
</header>

<h1>Medications catalog</h1>

<p th:if="${#lists.isEmpty(medications)}">No medications found</p>

<table th:unless="${#lists.isEmpty(medications)}">
    <thead>
    <tr>
        <th>Title</th>
        <th>Price</th>
        <th>Type</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="medication: ${medications}">
        <td th:text="${medication.title}">Medication</td>
        <td th:text="${medication.price}">0</td>
        <td th:text="${medication.medicationType}">type</td>
    </tr>
    </tbody>
</table>
<a th:href="@{/medications/new}">Add new medication!</a>
</body>
</html>
