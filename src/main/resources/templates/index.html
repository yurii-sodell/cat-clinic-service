<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/general-imports :: head-common(#{index.title})}" />
</head>
<body class="bg-milk d-flex flex-column min-vh-100">
<header>
    <h1 th:text="#{index.heading}"
        class="display-5 fw-bold text-center py-4 mb-0 bg-indigo text-neutral border-bottom border-5 border-deep-green">
        Welcome to Cat Clinic!
    </h1>
</header>

<main class="container flex-grow-1 d-flex align-items-center py-5">
    <nav class="row row-cols-1 row-cols-md-3 g-4 w-100">

        <div class="col">
            <div class="card h-100 border-0 shadow rounded-4 text-center">
                <div class="card-body py-5">
                    <div class="ratio ratio-1x1 w-50 mx-auto mb-4">
                        <div class="rounded-circle bg-soft-yellow text-indigo-dark d-flex align-items-center justify-content-center display-3">
                            <i class="fa-solid fa-cat"></i>
                        </div>
                    </div>
                    <h2 class="h3 mb-0">
                        <a class="stretched-link text-decoration-none text-indigo-dark"
                           th:href="@{/cats}" th:text="#{navigation.catspage}">Cats</a>
                    </h2>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card h-100 border-0 shadow rounded-4 text-center">
                <div class="card-body py-5">
                    <div class="ratio ratio-1x1 w-50 mx-auto mb-4">
                        <div class="rounded-circle bg-deep-green text-neutral d-flex align-items-center justify-content-center display-3">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                    <h2 class="h3 mb-0">
                        <a class="stretched-link text-decoration-none text-indigo-dark"
                           th:href="@{/owners}" th:text="#{navigation.ownerspage}">Owners</a>
                    </h2>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card h-100 border-0 shadow rounded-4 text-center">
                <div class="card-body py-5">
                    <div class="ratio ratio-1x1 w-50 mx-auto mb-4">
                        <div class="rounded-circle bg-indigo text-neutral d-flex align-items-center justify-content-center display-3">
                            <i class="fa-solid fa-pills"></i>
                        </div>
                    </div>
                    <h2 class="h3 mb-0">
                        <a class="stretched-link text-decoration-none text-indigo-dark"
                           th:href="@{/medications}" th:text="#{navigation.medicationspage}">Medications</a>
                    </h2>
                </div>
            </div>
        </div>

    </nav>
</main>
</body>
</html>
