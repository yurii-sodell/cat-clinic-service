<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medication adding form</title>
</head>
<body>
<header>
    <div th:replace="~{components/navigation :: navigation}"></div>
</header>

<form th:action="@{/medications/add}" th:object="${medicationForm}" method="post" onsubmit="">
    <label>Title</label>
    <input type="text" th:field="*{title}" required>

    <label>Price</label>
    <input type="number" th:field="*{price}" required>

    <label>Weeks after birth to start medication</label>
    <input type="number" th:field="*{weeksAfterBirthToStartMedication}" required>

    <label>Market release date</label>
    <input type="date" th:field="*{marketReleaseDate}" required>


    <label for="medicationType">Choose a Medication Type:</label>
    <select id="medicationType" name="medicationType">
        <option value="PILLS">Pills</option>
        <option value="OINTMENT">Ointment</option>
        <option value="DROPS">Drops</option>
        <option value="SYRUP">Syrup</option>
        <option value="POWDER">Powder</option>
        <option value="INJECTION">Injection</option>
    </select>

    <label>Is prescription needed</label>
    <input type="checkbox" th:field="*{prescriptionNeeded}">

    <label>Can be gifted</label>
    <input type="checkbox" th:field="*{canBeGiftedOnCatsBirthday}">

    <label>Photo (optional)</label>
    <input type="url" th:field="*{photo}">

    <button type="submit">Add medication</button>
</form>
</body>
</html>
