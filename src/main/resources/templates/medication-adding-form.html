<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{medication-adding-form.title}">Medication adding form</title>
    <link rel="stylesheet" th:href="@{css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
</head>
<body>
<header>
    <div th:replace="~{components/navigation :: navigation}"></div>
</header>
<main>
    <form th:action="@{/medications/new}" th:object="${medicationForm}" method="post">
        <label for="medication-form-title" th:text="#{medication-adding-form.medicationtitle}">Title</label>
        <input id="medication-form-title" type="text" th:field="*{title}" required/>

        <label for="medication-form-price" th:text="#{medication-adding-form.price}">Price</label>
        <input id="medication-form-price" type="number" th:field="*{price}" required/>

        <label for="medication-form-weeks-after-birth" th:text="#{medication-adding-form.weeksafterbirth}">Weeks after birth to start medication</label>
        <input id="medication-form-weeks-after-birth" type="number" th:field="*{weeksAfterBirthToStartMedication}" required/>

        <label for="medication-form-market-release-date" th:text="#{medication-adding-form.releasedate}">Market release date</label>
        <input id="medication-form-market-release-date" type="number" th:field="*{marketReleaseDate}" required/>

        <label for="medication-form-type" th:text="#{medication-adding-form.type}">Choose a Medication Type:</label>
        <select id="medication-form-type" name="medicationType">
            <option th:each="type : ${medicationTypes}"
                    th:value="${type}"
                    th:text="${type.getDisplayName()}"></option>
        </select>

        <label for="medication-form-prescription-needed" th:text="#{medication-adding-form.prescription}">Is prescription needed</label>
        <input id="medication-form-prescription-needed" type="checkbox" th:field="*{prescriptionNeeded}"/>

        <label for="medication-form-can-be-gifted" th:text="#{medication-adding-form.gifted}">Can be gifted</label>
        <input id="medication-form-can-be-gifted" type="checkbox" th:field="*{canBeGiftedOnCatsBirthday}"/>

        <label for="medication-form-photo" th:text="#{medication-adding-form.photo}">Photo (optional)</label>
        <input id="medication-form-photo" type="url" th:field="*{photo}"/>

        <button type="submit" th:text="#{medication-adding-form.submit}">Add medication</button>
    </form>
</main>
</body>
</html>
