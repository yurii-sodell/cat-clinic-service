<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/general-imports :: head-common(#{owner-page.title})}" />
</head>
<body class="bg-milk d-flex flex-column min-vh-100">
<header>
    <div th:replace="~{components/navigation :: navigation}"></div>
</header>

<main class="container flex-grow-1 py-5">
    <section th:object="${ownerOnPage}">
        <h1 th:text="*{name + ' ' + familyName}" class="display-6 fw-bold text-indigo-dark mb-4">Name Family</h1>

        <div class="card border-0 shadow rounded-4 overflow-hidden mb-5">
            <table class="table align-middle mb-0">
                <tbody>
                <tr>
                    <th class="py-3 px-4 text-indigo-dark w-50" th:text="#{owner-page.livingspace}">Living space (m²)</th>
                    <td class="py-3 px-4" th:text="*{livingSpaceSquareMeters}">0</td>
                </tr>
                <tr>
                    <th class="py-3 px-4 text-indigo-dark" th:text="#{owner-page.kids}">Number of kids</th>
                    <td class="py-3 px-4" th:text="*{amountOfKids}">0</td>
                </tr>
                <tr>
                    <th class="py-3 px-4 text-indigo-dark" th:text="#{owner-page.phone}">Phone</th>
                    <td class="py-3 px-4" th:text="*{ownerPersonsPhone}">+99999999999</td>
                </tr>
                <tr>
                    <th class="py-3 px-4 text-indigo-dark" th:text="#{owner-page.idcard}">ID card photo</th>
                    <td class="py-3 px-4">
                        <img th:if="*{photoOfOwnersIdCard != null}"
                             th:text="*{photoOfOwnersIdCard}"
                             th:alt="#{owner-page.idcard}"
                             class="img-fluid rounded-3 shadow-sm"
                             width="200">
                    </td>
                </tr>
                <tr>
                    <th class="py-3 px-4 text-indigo-dark" th:text="#{owner-page.registrationdate}">Registration date</th>
                    <td class="py-3 px-4" th:text="*{#temporals.format(registrationDate, 'dd.MM.yyyy')}">01.01.2026</td>
                </tr>
                <tr>
                    <th class="py-3 px-4 text-indigo-dark" th:text="#{owner-page.smokes}">Smokes at home</th>
                    <td class="py-3 px-4">
                        <span class="badge fs-6 px-3 py-2 rounded-pill"
                              th:classappend="*{smokesAtHome} ? 'bg-deep-green text-neutral' : 'bg-soft-yellow text-indigo-dark'"
                              th:text="*{smokesAtHome} ? #{owner-page.yes} : #{owner-page.no}">No</span>
                    </td>
                </tr>
                <tr>
                    <th class="py-3 px-4 text-indigo-dark" th:text="#{owner-page.language}">Preferred communication language</th>
                    <td class="py-3 px-4">
                        <span class="badge bg-soft-yellow text-indigo-dark fs-6 px-3 py-2 rounded-pill"
                              th:text="*{preferredCommunicationLanguage.getLanguageName()}">Language</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <h2 th:text="#{owner-page.cats}" class="h3 fw-bold text-indigo-dark mb-3">Cats</h2>

        <div th:if="*{cats.isEmpty()}"
             class="card border-0 rounded-4 bg-soft-yellow text-indigo-dark text-center">
            <div class="card-body py-4">
                <p class="h5 mb-0" th:text="#{owner-page.nocats}">No cats registered</p>
            </div>
        </div>

        <div th:unless="*{cats.isEmpty()}" class="card border-0 shadow rounded-4 overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="bg-indigo text-neutral fs-5 py-3 px-4" th:text="#{owner-page.catname}">Cat</th>
                    <th class="bg-indigo text-neutral fs-5 py-3 px-4 text-end" th:text="#{owner-page.catedit}">Edit</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : *{cats}">
                    <td class="py-3 px-4 fw-semibold text-indigo-dark" th:text="${cat.name}">Name</td>
                    <td class="py-3 px-4 text-end">
                        <a th:href="@{/cats/edit/{catId}(catId=${cat.catId})}" th:text="#{owner-page.catedit}"
                           class="btn btn-sm bg-soft-yellow text-indigo-dark fw-bold px-3 rounded-pill">Edit</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
